[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recordation"
version = "1.0.0"
description = "Visual Browser Automation Builder for Lemur/Kiwi on Android & Desktop Chrome"
readme = "README.md"
authors = [{ name = "Recordation Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["automation", "browser", "recorder", "truedriver", "kiwi", "lemur", "playwright", "chrome-extension"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers"
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "truedriver>=0.1.0"
]

[project.optional-dependencies]
playwright = ["playwright>=1.40.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
recordation = "recordation.cli:cli"

[tool.setuptools.package-dir]
"" = "python"
