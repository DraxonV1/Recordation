[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recordation"
version = "1.0.2"
description = "A browser extension that records your actions to export them to executable browser automation (Python / Extension)"
readme = "README.md"
authors = [{ name = "DraxonV1" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["automation", "browser", "recorder", "truedriver", "playwright", "chrome-extension"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers"
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "truedriver>=0.1.0"
]

[project.urls]
Homepage = "https://github.com/DraxonV1/Recordation"
Repository = "https://github.com/DraxonV1/Recordation"
Issues = "https://github.com/DraxonV1/Recordation/issues"

[project.optional-dependencies]
playwright = ["playwright>=1.40.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
recordation = "recordation.cli:cli"

[tool.setuptools.packages.find]
where = ["python"]
include = ["recordation*"]
